<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoBlue Tours — Login</title>
<link rel="icon" href="https://gobluetours.com/favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-ocean:#062037;
    --ocean-bright:#1f78b4;
    --sand:#f4a860;
    --paper:#f6f9fc;
    --ink:#101d2c;
    --slate:#5c6b7d;
    --line:#e1e8ef;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:'Plus Jakarta Sans',sans-serif;
    display:flex; min-height:100vh;
  }

  .stage{ display:flex; width:100%; min-height:100vh; }

  /* ---- Left hero panel ---- */
  .hero{
    position:relative; flex:0 0 44%; overflow:hidden; display:flex; flex-direction:column;
    justify-content:space-between; padding:3rem 3.25rem;
    background:
      radial-gradient(120% 140% at 15% 8%, #1c5f95 0%, transparent 55%),
      radial-gradient(120% 120% at 85% 95%, #0a3a63 0%, transparent 60%),
      linear-gradient(160deg, var(--deep-ocean) 0%, #0a3457 55%, #0d4570 100%);
  }
  .hero-swell{
    position:absolute; inset:auto 0 0 0; height:38%; opacity:.5; pointer-events:none;
  }
  .hero-dots{
    position:absolute; inset:0; opacity:.14; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.6) 1px, transparent 1.5px);
    background-size:26px 26px;
  }
  .hero-logo{ position:relative; z-index:1; align-self:flex-start; }
  .hero-copy{ position:relative; z-index:1; }
  .hero-eyebrow{
    font-family:'Archivo',sans-serif; font-weight:800; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--sand); margin-bottom:.9rem;
  }
  .hero-title{
    font-family:'Archivo',sans-serif; font-weight:900; font-size:38px; line-height:1.12; letter-spacing:-0.02em;
    color:#fff; max-width:20ch;
  }
  .hero-sub{ margin-top:1rem; color:#c7dcee; font-size:15px; line-height:1.6; max-width:34ch; }
  .hero-foot{ position:relative; z-index:1; color:#7fa6c4; font-size:12.5px; }

  @media (max-width:900px){
    .stage{ flex-direction:column; }
    .hero{ flex:0 0 auto; padding:2.25rem 1.75rem 3.25rem; }
    .hero-title{ font-size:28px; max-width:none; }
    .hero-sub{ max-width:none; }
  }

  /* ---- Right form panel ---- */
  .form-panel{ flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.75rem; }
  .form-shell{ width:100%; max-width:380px; }

  .form-eyebrow{ color:var(--slate); font-size:13.5px; font-weight:600; margin-bottom:.35rem; }
  .form-title{
    font-family:'Archivo',sans-serif; font-weight:900; font-size:30px; letter-spacing:-0.02em; color:var(--ink);
    margin-bottom:2rem;
  }

  .google-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:.65rem;
    border:1px solid var(--line); border-radius:.7rem; padding:.8rem 1rem; background:#fff;
    font-size:.92rem; font-weight:600; color:var(--ink); cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .google-btn:hover{ border-color:#c3cfda; box-shadow:0 2px 10px -4px rgba(16,29,44,.12); }

  .divider-row{ display:flex; align-items:center; gap:.85rem; color:var(--slate); font-size:.8rem; font-weight:600; margin:1.5rem 0; text-transform:uppercase; letter-spacing:.06em; }
  .divider-row::before, .divider-row::after{ content:''; flex:1; height:1px; background:var(--line); }

  .field-group{ position:relative; margin-bottom:1rem; }
  .field-icon{ position:absolute; left:.95rem; top:50%; transform:translateY(-50%); color:var(--slate); pointer-events:none; }
  .login-field{
    width:100%; border:1px solid var(--line); border-radius:.7rem; padding:.85rem 1rem .85rem 2.75rem; font-size:.93rem;
    font-weight:500; color:var(--ink); background:#fff; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .login-field::placeholder{ color:#93a2b2; font-weight:500; }
  .login-field:focus{ outline:none; border-color:var(--ocean-bright); box-shadow:0 0 0 3px rgba(31,120,180,.14); }

  .login-submit{
    width:100%; background:linear-gradient(135deg, var(--ocean-bright), var(--deep-ocean)); color:#fff; border-radius:.7rem; padding:.9rem 1.1rem;
    font-size:.96rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:.45rem;
    margin-top:1.6rem; transition:transform .15s ease, box-shadow .15s ease; box-shadow:0 10px 22px -10px rgba(6,32,55,.55);
  }
  .login-submit:hover{ transform:translateY(-1px); box-shadow:0 14px 26px -10px rgba(6,32,55,.6); }
  .login-submit:active{ transform:translateY(0); }

  .form-foot{ margin-top:1.75rem; text-align:center; color:var(--slate); font-size:12.5px; }

  @media (prefers-reduced-motion: reduce){
    .login-submit{ transition:none; }
  }
</style>
</head>
<body class="antialiased">

<div class="stage">

  <!-- ================= HERO PANEL ================= -->
  <aside class="hero">
    <div class="hero-dots"></div>
    <svg class="hero-swell" viewBox="0 0 600 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,140 C90,180 180,90 280,120 C380,150 460,90 600,130 L600,220 L0,220 Z" fill="#ffffff" fill-opacity="0.05"/>
      <path d="M0,170 C110,120 210,190 320,150 C420,115 500,175 600,150 L600,220 L0,220 Z" fill="#ffffff" fill-opacity="0.08"/>
    </svg>

    <img src="https://gobluetours.com/logo-white.webp" alt="Go Blue Tours" class="hero-logo" style="height:40px; width:auto;">

    <div class="hero-copy">
      <p class="hero-eyebrow">Staff Dashboard</p>
      <h1 class="hero-title">Manage every group trip from one place.</h1>
      <p class="hero-sub">Bookings, quotes, manifests, and payments — for your whole team.</p>
    </div>

    <p class="hero-foot">&copy; 2026 Go Blue Tours. Internal use only.</p>
  </aside>

  <!-- ================= FORM PANEL ================= -->
  <main class="form-panel">
    <div class="form-shell">
      <p class="form-eyebrow">Welcome back</p>
      <h2 class="form-title">Log in to your account</h2>

      <form id="login-form">
        <button type="button" class="google-btn" id="google-login-btn">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/>
            <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5C29.5 34.9 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.9 39.6 16.4 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4 5.6l6.5 5.5C41.4 36.5 44 30.9 44 24c0-1.2-.1-2.4-.4-3.5z"/>
          </svg>
          Login with Google
        </button>

        <div class="divider-row">or</div>

        <div class="field-group">
          <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input type="text" class="login-field" placeholder="Username" id="username-field" autocomplete="username">
        </div>
        <div class="field-group">
          <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" class="login-field" placeholder="Password" id="password-field" autocomplete="current-password">
        </div>

        <button type="submit" class="login-submit">
          Login
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </form>

      <p class="form-foot">Trouble signing in? Contact your account admin.</p>
    </div>
  </main>

</div>

<script>
  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    window.location.href = 'index.html';
  });
  document.getElementById('google-login-btn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
